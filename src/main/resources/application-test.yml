spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/monetari
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  security:
    api-key: secret-key
  coingecko:
    base-url: https://api.coingecko.com/api/v3

logging:
  level:
    root: WARN