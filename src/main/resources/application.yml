server:
  port: 8080

spring:
  application:
    name: monetari

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monetari}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

app:
  coingecko:
    base-url: https://api.coingecko.com/api/v3

  security:
    api-key: secret-key

logging:
  level:
    root: INFO
    com.bugra.monetari: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html